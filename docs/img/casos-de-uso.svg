<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <rect width="1280" height="900" fill="#f5f6f8"/>
  <text x="48" y="40" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#171b29">Diagrama de Casos de Uso</text>
  <text x="48" y="66" font-family="Arial,sans-serif" font-size="13" fill="#667086">Raízes do Nordeste · Sistema de pedidos (Web / App / Totem)</text>

  <!-- system -->
  <rect x="240" y="100" width="700" height="700" rx="14" fill="#fafbfc" stroke="#d1d5de"/>
  <text x="260" y="128" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#3373b8">Sistema</text>

  <!-- associations subtle -->
  <g stroke="#8e95a3" stroke-width="1.2" fill="none" opacity="0.7">
    <line x1="190" y1="236" x2="280" y2="185"/>
    <line x1="190" y1="236" x2="280" y2="255"/>
    <line x1="190" y1="236" x2="280" y2="325"/>
    <line x1="190" y1="236" x2="280" y2="395"/>
    <line x1="190" y1="236" x2="280" y2="465"/>
    <line x1="190" y1="236" x2="280" y2="535"/>
    <line x1="190" y1="236" x2="560" y2="185"/>
    <line x1="190" y1="236" x2="560" y2="255"/>
    <line x1="190" y1="476" x2="560" y2="325"/>
    <line x1="190" y1="356" x2="560" y2="465"/>
    <line x1="1000" y1="316" x2="780" y2="395"/>
    <line x1="1000" y1="436" x2="780" y2="465"/>
  </g>

  <!-- UCs left col -->
  <g font-family="Arial,sans-serif">
    <ellipse cx="390" cy="185" rx="110" ry="25" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="390" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#3373b8">UC01</text>
    <text x="390" y="196" text-anchor="middle" font-size="12" fill="#171b29">Cadastrar / autenticar</text>
    <ellipse cx="390" cy="255" rx="110" ry="25" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="390" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#3373b8">UC02</text>
    <text x="390" y="266" text-anchor="middle" font-size="12" fill="#171b29">Cardápio por unidade</text>
    <ellipse cx="390" cy="325" rx="110" ry="25" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="390" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#3373b8">UC03</text>
    <text x="390" y="336" text-anchor="middle" font-size="12" fill="#171b29">Montar pedido</text>
    <ellipse cx="390" cy="395" rx="110" ry="25" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="390" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#3373b8">UC04</text>
    <text x="390" y="406" text-anchor="middle" font-size="12" fill="#171b29">Consentimento LGPD</text>
    <ellipse cx="390" cy="465" rx="110" ry="25" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="390" y="460" text-anchor="middle" font-size="10" font-weight="bold" fill="#3373b8">UC05</text>
    <text x="390" y="476" text-anchor="middle" font-size="12" fill="#171b29">Pagamento externo</text>
    <ellipse cx="390" cy="535" rx="110" ry="25" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="390" y="530" text-anchor="middle" font-size="10" font-weight="bold" fill="#3373b8">UC06</text>
    <text x="390" y="546" text-anchor="middle" font-size="12" fill="#171b29">Status do pedido</text>
    <!-- right col -->
    <ellipse cx="670" cy="185" rx="110" ry="25" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="670" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#3373b8">UC07</text>
    <text x="670" y="196" text-anchor="middle" font-size="12" fill="#171b29">Fidelidade</text>
    <ellipse cx="670" cy="255" rx="110" ry="25" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="670" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#3373b8">UC08</text>
    <text x="670" y="266" text-anchor="middle" font-size="12" fill="#171b29">Promoções</text>
    <ellipse cx="670" cy="325" rx="110" ry="25" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="670" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#3373b8">UC09</text>
    <text x="670" y="336" text-anchor="middle" font-size="12" fill="#171b29">Gerenciar cardápio</text>
    <ellipse cx="670" cy="395" rx="110" ry="25" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="670" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#3373b8">UC10</text>
    <text x="670" y="406" text-anchor="middle" font-size="12" fill="#171b29">Preparar pedido</text>
    <ellipse cx="670" cy="465" rx="110" ry="25" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="670" y="460" text-anchor="middle" font-size="10" font-weight="bold" fill="#3373b8">UC11</text>
    <text x="670" y="476" text-anchor="middle" font-size="12" fill="#171b29">Atender / entregar</text>
  </g>

  <!-- actor cards left -->
  <g font-family="Arial,sans-serif">
    <rect x="40" y="200" width="150" height="72" rx="10" fill="#fff" stroke="#d1d5de"/>
    <circle cx="72" cy="236" r="18" fill="#1f406c"/>
    <text x="72" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">C</text>
    <text x="100" y="230" font-size="13" font-weight="bold" fill="#171b29">Cliente</text>
    <text x="100" y="248" font-size="11" fill="#667086">Canal digital</text>

    <rect x="40" y="320" width="150" height="72" rx="10" fill="#fff" stroke="#d1d5de"/>
    <circle cx="72" cy="356" r="18" fill="#1f406c"/>
    <text x="72" y="361" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">A</text>
    <text x="100" y="350" font-size="13" font-weight="bold" fill="#171b29">Atendente</text>
    <text x="100" y="368" font-size="11" fill="#667086">Loja</text>

    <rect x="40" y="440" width="150" height="72" rx="10" fill="#fff" stroke="#d1d5de"/>
    <circle cx="72" cy="476" r="18" fill="#1f406c"/>
    <text x="72" y="481" text-anchor="middle" font-size="13" font-weight="bold" fill="#171b29" fill="#fff">G</text>
    <text x="100" y="470" font-size="13" font-weight="bold" fill="#171b29">Gerente</text>
    <text x="100" y="488" font-size="11" fill="#667086">Gestão</text>
  </g>

  <!-- actor cards right -->
  <g font-family="Arial,sans-serif">
    <rect x="1000" y="280" width="150" height="72" rx="10" fill="#fff" stroke="#d1d5de"/>
    <circle cx="1032" cy="316" r="18" fill="#1f406c"/>
    <text x="1032" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">K</text>
    <text x="1060" y="310" font-size="13" font-weight="bold" fill="#171b29">Cozinha</text>
    <text x="1060" y="328" font-size="11" fill="#667086">Operação</text>

    <rect x="1000" y="400" width="150" height="72" rx="10" fill="#fff" stroke="#d1d5de"/>
    <circle cx="1032" cy="436" r="18" fill="#1f406c"/>
    <text x="1032" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">P</text>
    <text x="1060" y="430" font-size="13" font-weight="bold" fill="#171b29">Pagamento</text>
    <text x="1060" y="448" font-size="11" fill="#667086">Externo</text>
  </g>

  <rect x="48" y="820" width="1184" height="50" rx="10" fill="#fff" stroke="#d1d5de"/>
  <text x="68" y="850" font-family="Arial,sans-serif" font-size="12" fill="#667086">Legenda: elipse = caso de uso · card = ator · linha = associação (participação)</text>
</svg>
