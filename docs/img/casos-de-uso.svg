<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920">
  <rect width="1000" height="920" fill="#faf8f5"/>
  <text x="36" y="40" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1a1410">Diagrama de Casos de Uso</text>
  <text x="36" y="64" font-family="Arial,sans-serif" font-size="13" fill="#666">Raizes do Nordeste — quem faz o que no sistema</text>
  <text x="36" y="100" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#888">ATORES</text>
  <rect x="36" y="115" width="200" height="58" rx="8" fill="#fff5e6" stroke="#c47a2c" stroke-width="1.5"/>
  <text x="50" y="140" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#222">Cliente</text>
  <text x="50" y="158" font-family="Arial,sans-serif" font-size="11" fill="#666">Pede e acompanha</text>
  <rect x="36" y="185" width="200" height="58" rx="8" fill="#fff5e6" stroke="#c47a2c" stroke-width="1.5"/>
  <text x="50" y="210" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#222">Atendente</text>
  <text x="50" y="228" font-family="Arial,sans-serif" font-size="11" fill="#666">Atende o pedido</text>
  <rect x="36" y="255" width="200" height="58" rx="8" fill="#fff5e6" stroke="#c47a2c" stroke-width="1.5"/>
  <text x="50" y="280" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#222">Cozinha</text>
  <text x="50" y="298" font-family="Arial,sans-serif" font-size="11" fill="#666">Prepara o pedido</text>
  <rect x="36" y="325" width="200" height="58" rx="8" fill="#fff5e6" stroke="#c47a2c" stroke-width="1.5"/>
  <text x="50" y="350" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#222">Gerente</text>
  <text x="50" y="368" font-family="Arial,sans-serif" font-size="11" fill="#666">Cardapio e campanhas</text>
  <rect x="36" y="395" width="200" height="58" rx="8" fill="#fff5e6" stroke="#c47a2c" stroke-width="1.5"/>
  <text x="50" y="420" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#222">Pagamento</text>
  <text x="50" y="438" font-family="Arial,sans-serif" font-size="11" fill="#666">Servico externo</text>
  <rect x="36" y="480" width="200" height="160" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
  <text x="50" y="508" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#222">Quem usa o que</text>
  <text x="50" y="535" font-family="Arial,sans-serif" font-size="12" fill="#333">Cliente = 1 a 7</text>
  <text x="50" y="558" font-family="Arial,sans-serif" font-size="12" fill="#333">Cozinha = 8</text>
  <text x="50" y="581" font-family="Arial,sans-serif" font-size="12" fill="#333">Atendente = 9</text>
  <text x="50" y="604" font-family="Arial,sans-serif" font-size="12" fill="#333">Gerente = gestao</text>
  <text x="50" y="627" font-family="Arial,sans-serif" font-size="12" fill="#333">Pagamento = 5</text>
  <rect x="280" y="100" width="480" height="720" rx="10" fill="#f7f1e8" stroke="#8b6914" stroke-width="2"/>
  <text x="300" y="130" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#8b6914">Sistema (Web / App / Totem)</text>
  <text x="300" y="165" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#c47a2c">Cliente (app / site)</text>
  <ellipse cx="520" cy="202" rx="160" ry="26" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#222">1. Cadastrar / entrar</text>
  <ellipse cx="520" cy="264" rx="160" ry="26" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="269" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#222">2. Ver cardapio da unidade</text>
  <ellipse cx="520" cy="326" rx="160" ry="26" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="331" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#222">3. Montar pedido (sacola)</text>
  <ellipse cx="520" cy="388" rx="160" ry="26" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#222">4. Aceitar LGPD</text>
  <ellipse cx="520" cy="450" rx="160" ry="26" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#222">5. Pagar (servico externo)</text>
  <ellipse cx="520" cy="512" rx="160" ry="26" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="517" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#222">6. Acompanhar status</text>
  <ellipse cx="520" cy="574" rx="160" ry="26" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="579" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#222">7. Ver fidelidade / promo</text>
  <text x="300" y="630" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#c47a2c">Equipe da loja</text>
  <ellipse cx="520" cy="672" rx="160" ry="26" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="677" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#222">8. Preparar pedido (cozinha)</text>
  <ellipse cx="520" cy="734" rx="160" ry="26" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="739" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#222">9. Atender / entregar</text>
  <text x="36" y="900" font-family="Arial,sans-serif" font-size="12" fill="#666">Cada elipse = uma funcao. A lista ao lado mostra as associacoes sem emaranhado de linhas.</text>
</svg>
