<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920">
  <rect width="1100" height="920" fill="#f7f7f8"/>
  <text x="40" y="40" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1c1c1e">Diagrama de Casos de Uso</text>
  <text x="40" y="66" font-family="Arial,sans-serif" font-size="14" fill="#73737a">Raízes do Nordeste — quem interage com cada função do sistema</text>

  <!-- actors panel -->
  <rect x="40" y="100" width="280" height="420" rx="16" fill="#fff" stroke="#e0e0e4"/>
  <text x="60" y="128" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#73737a">ATORES</text>
  <circle cx="72" cy="168" r="12" fill="#2563eb"/>
  <text x="96" y="164" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1c1c1e">Cliente</text>
  <text x="96" y="182" font-family="Arial,sans-serif" font-size="12" fill="#73737a">Pede, paga e acompanha</text>
  <circle cx="72" cy="228" r="12" fill="#7c3aed"/>
  <text x="96" y="224" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1c1c1e">Atendente</text>
  <text x="96" y="242" font-family="Arial,sans-serif" font-size="12" fill="#73737a">Entrega o pedido</text>
  <circle cx="72" cy="288" r="12" fill="#059669"/>
  <text x="96" y="284" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1c1c1e">Cozinha</text>
  <text x="96" y="302" font-family="Arial,sans-serif" font-size="12" fill="#73737a">Prepara o pedido</text>
  <circle cx="72" cy="348" r="12" fill="#d97706"/>
  <text x="96" y="344" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1c1c1e">Gerente</text>
  <text x="96" y="362" font-family="Arial,sans-serif" font-size="12" fill="#73737a">Cardápio e campanhas</text>
  <circle cx="72" cy="408" r="12" fill="#db2777"/>
  <text x="96" y="404" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1c1c1e">Pagamento externo</text>
  <text x="96" y="422" font-family="Arial,sans-serif" font-size="12" fill="#73737a">Gateway simulado</text>

  <!-- system panel -->
  <rect x="350" y="100" width="710" height="640" rx="16" fill="#f8f8fa" stroke="#e0e0e4"/>
  <text x="370" y="128" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#73737a">SISTEMA  ·  Web / App / Totem</text>

  <!-- UC rows -->
  <g font-family="Arial,sans-serif">
    <!-- UC01 -->
    <rect x="370" y="150" width="670" height="44" rx="10" fill="#fff" stroke="#e0e0e4"/>
    <rect x="370" y="150" width="5" height="44" rx="2" fill="#2563eb"/>
    <text x="390" y="178" font-size="12" font-weight="bold" fill="#73737a">UC01</text>
    <text x="450" y="178" font-size="14" fill="#1c1c1e">Cadastrar / autenticar</text>
    <circle cx="1005" cy="172" r="8" fill="#2563eb"/>
    <!-- UC02 -->
    <rect x="370" y="202" width="670" height="44" rx="10" fill="#fff" stroke="#e0e0e4"/>
    <rect x="370" y="202" width="5" height="44" fill="#2563eb"/>
    <text x="390" y="230" font-size="12" font-weight="bold" fill="#73737a">UC02</text>
    <text x="450" y="230" font-size="14" fill="#1c1c1e">Consultar cardápio por unidade</text>
    <circle cx="1005" cy="224" r="8" fill="#2563eb"/>
    <!-- UC03 -->
    <rect x="370" y="254" width="670" height="44" rx="10" fill="#fff" stroke="#e0e0e4"/>
    <rect x="370" y="254" width="5" height="44" fill="#2563eb"/>
    <text x="390" y="282" font-size="12" font-weight="bold" fill="#73737a">UC03</text>
    <text x="450" y="282" font-size="14" fill="#1c1c1e">Montar pedido (sacola)</text>
    <circle cx="1005" cy="276" r="8" fill="#2563eb"/>
    <!-- UC04 -->
    <rect x="370" y="306" width="670" height="44" rx="10" fill="#fff" stroke="#e0e0e4"/>
    <rect x="370" y="306" width="5" height="44" fill="#2563eb"/>
    <text x="390" y="334" font-size="12" font-weight="bold" fill="#73737a">UC04</text>
    <text x="450" y="334" font-size="14" fill="#1c1c1e">Registrar consentimento LGPD</text>
    <circle cx="1005" cy="328" r="8" fill="#2563eb"/>
    <!-- UC05 -->
    <rect x="370" y="358" width="670" height="44" rx="10" fill="#fff" stroke="#e0e0e4"/>
    <rect x="370" y="358" width="5" height="44" fill="#2563eb"/>
    <text x="390" y="386" font-size="12" font-weight="bold" fill="#73737a">UC05</text>
    <text x="450" y="386" font-size="14" fill="#1c1c1e">Solicitar pagamento externo</text>
    <circle cx="980" cy="380" r="8" fill="#2563eb"/>
    <circle cx="1005" cy="380" r="8" fill="#db2777"/>
    <!-- UC06 -->
    <rect x="370" y="410" width="670" height="44" rx="10" fill="#fff" stroke="#e0e0e4"/>
    <rect x="370" y="410" width="5" height="44" fill="#2563eb"/>
    <text x="390" y="438" font-size="12" font-weight="bold" fill="#73737a">UC06</text>
    <text x="450" y="438" font-size="14" fill="#1c1c1e">Acompanhar status do pedido</text>
    <circle cx="1005" cy="432" r="8" fill="#2563eb"/>
    <!-- UC07 -->
    <rect x="370" y="462" width="670" height="44" rx="10" fill="#fff" stroke="#e0e0e4"/>
    <rect x="370" y="462" width="5" height="44" fill="#2563eb"/>
    <text x="390" y="490" font-size="12" font-weight="bold" fill="#73737a">UC07</text>
    <text x="450" y="490" font-size="14" fill="#1c1c1e">Consultar fidelidade</text>
    <circle cx="1005" cy="484" r="8" fill="#2563eb"/>
    <!-- UC08 -->
    <rect x="370" y="514" width="670" height="44" rx="10" fill="#fff" stroke="#e0e0e4"/>
    <rect x="370" y="514" width="5" height="44" fill="#2563eb"/>
    <text x="390" y="542" font-size="12" font-weight="bold" fill="#73737a">UC08</text>
    <text x="450" y="542" font-size="14" fill="#1c1c1e">Visualizar promoções</text>
    <circle cx="1005" cy="536" r="8" fill="#2563eb"/>
    <!-- UC09 -->
    <rect x="370" y="566" width="670" height="44" rx="10" fill="#fff" stroke="#e0e0e4"/>
    <rect x="370" y="566" width="5" height="44" fill="#d97706"/>
    <text x="390" y="594" font-size="12" font-weight="bold" fill="#73737a">UC09</text>
    <text x="450" y="594" font-size="14" fill="#1c1c1e">Gerenciar cardápio</text>
    <circle cx="1005" cy="588" r="8" fill="#d97706"/>
    <!-- UC10 -->
    <rect x="370" y="618" width="670" height="44" rx="10" fill="#fff" stroke="#e0e0e4"/>
    <rect x="370" y="618" width="5" height="44" fill="#059669"/>
    <text x="390" y="646" font-size="12" font-weight="bold" fill="#73737a">UC10</text>
    <text x="450" y="646" font-size="14" fill="#1c1c1e">Preparar pedido</text>
    <circle cx="1005" cy="640" r="8" fill="#059669"/>
    <!-- UC11 -->
    <rect x="370" y="670" width="670" height="44" rx="10" fill="#fff" stroke="#e0e0e4"/>
    <rect x="370" y="670" width="5" height="44" fill="#7c3aed"/>
    <text x="390" y="698" font-size="12" font-weight="bold" fill="#73737a">UC11</text>
    <text x="450" y="698" font-size="14" fill="#1c1c1e">Atender / entregar pedido</text>
    <circle cx="1005" cy="692" r="8" fill="#7c3aed"/>
  </g>

  <!-- associations legend -->
  <rect x="40" y="540" width="280" height="200" rx="16" fill="#fff" stroke="#e0e0e4"/>
  <text x="60" y="568" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#73737a">ASSOCIAÇÕES</text>
  <circle cx="68" cy="598" r="7" fill="#2563eb"/>
  <text x="86" y="603" font-family="Arial,sans-serif" font-size="12" fill="#1c1c1e">Cliente → UC01–UC08</text>
  <circle cx="68" cy="626" r="7" fill="#db2777"/>
  <text x="86" y="631" font-family="Arial,sans-serif" font-size="12" fill="#1c1c1e">Pagamento → UC05</text>
  <circle cx="68" cy="654" r="7" fill="#d97706"/>
  <text x="86" y="659" font-family="Arial,sans-serif" font-size="12" fill="#1c1c1e">Gerente → UC09</text>
  <circle cx="68" cy="682" r="7" fill="#059669"/>
  <text x="86" y="687" font-family="Arial,sans-serif" font-size="12" fill="#1c1c1e">Cozinha → UC10</text>
  <circle cx="68" cy="710" r="7" fill="#7c3aed"/>
  <text x="86" y="715" font-family="Arial,sans-serif" font-size="12" fill="#1c1c1e">Atendente → UC11</text>

  <text x="40" y="880" font-family="Arial,sans-serif" font-size="12" fill="#73737a">Cores = quem participa. Sem linhas cruzadas — leitura direta.</text>
  <text x="40" y="900" font-family="Arial,sans-serif" font-size="11" fill="#a1a1a8">UNINTER 2026 · Projeto Front-End</text>
</svg>
